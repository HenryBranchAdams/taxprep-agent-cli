name: CLI checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: cli-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Test the agent protocol and workflow
        run: python -m unittest discover -s tests -v
      - name: Validate the bundled catalog
        run: python -m taxprep doctor
      - name: Run the fictional diagnostics walkthrough
        run: python examples/diagnostics_demo.py
      - name: Build and check the standalone executable
        run: |
          python build_release.py
          python taxprep.pyz doctor
          python taxprep.pyz graph --node DIGITAL.broker_form --direction downstream --depth 2
